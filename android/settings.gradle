pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        // Configure the Maven repository address for the HMS Core SDK.
        maven {
            url = uri("https://developer.huawei.com/repo/")
        }
    }
}

